version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "27Aaron"
    labels:
      - "automation"
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "27Aaron"
    labels:
      - "automation"
      - "dependencies"
      - "nix"
    commit-message:
      prefix: "build"
      include: "scope"
