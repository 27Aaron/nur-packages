name: Update package sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  nvfetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'rm -f secrets.toml' EXIT
          cat > secrets.toml <<EOF
          [keys]
          github = "$GITHUB_TOKEN"
          EOF
          nix run .#update-sources

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-sources
          delete-branch: true
          commit-message: "build(sources): update package sources"
          title: "build(sources): update package sources"
          body: "Automated source version and hash updates generated by nvfetcher."
