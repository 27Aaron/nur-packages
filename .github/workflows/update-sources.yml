name: Update package sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  nvfetcher:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'rm -f secrets.toml' EXIT
          old_sing_box_version=$(jq -r '."sing-box-beta".version' _sources/generated.json)
          cat > secrets.toml <<EOF
          [keys]
          github = "$GITHUB_TOKEN"
          EOF
          nix run nixpkgs#nvfetcher -- -c nvfetcher.toml
          if [[ -n "$(tail -c 1 _sources/generated.json)" ]]; then
            printf '\n' >> _sources/generated.json
          fi
          new_sing_box_version=$(jq -r '."sing-box-beta".version' _sources/generated.json)
          if [[ "$old_sing_box_version" != "$new_sing_box_version" ]]; then
            nix run nixpkgs#nix-update -- sing-box-beta --flake --version=skip
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-sources
          delete-branch: true
          commit-message: "build(sources): update package sources"
          title: "build(sources): update package sources"
          body: "Automated source version and hash updates generated by nvfetcher."
