name: Update package sources

on:
  workflow_dispatch:
  schedule:
    - cron: "13 20 * * *"

concurrency:
  group: update-sources
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  nvfetcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          build-mount-path: /nix
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Nix build directory
        run: |
          sudo install -d -m 1777 /nix/build

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            build-dir = /nix/build
            log-lines = 25

      - name: Restore nvfetcher cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/nvfetcher
          key: nvfetcher-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvfetcher-${{ runner.os }}-

      - name: Update sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          trap 'rm -f secrets.toml' EXIT
          cat > secrets.toml <<EOF
          [keys]
          github = "$GITHUB_TOKEN"
          EOF
          nix run .#update-sources

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-sources
          delete-branch: true
          commit-message: "build(sources): update package sources"
          title: "build(sources): update package sources"
          body: "Automated source version and hash updates generated by nvfetcher."
