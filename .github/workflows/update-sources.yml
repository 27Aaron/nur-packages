name: Update flake lock and package sources

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to update (empty for all)"
        required: false
        default: ""
  schedule:
    # Nominally 04:13 and 16:13 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: "13 8,20 * * *"

concurrency:
  group: update-dependencies
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      patch: ${{ steps.serialize.outputs.patch }}
      summary: ${{ steps.summarize.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            log-lines = 25

      - name: Update flake lock
        run: nix flake update

      - name: Update package sources
        id: update_sources
        # A single failing updater must not block updates for the remaining
        # packages; failures are summarized in the pull request instead.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATE_PACKAGES: ${{ github.event.inputs.packages || '' }}
          NUR_UPDATE_FAILURES_FILE: ${{ runner.temp }}/failed-updates
        run: |
          touch "$RUNNER_TEMP/failed-updates"
          # The unquoted expansion splits the optional package list into arguments.
          # shellcheck disable=SC2086
          nix run path:.#update-sources -- $UPDATE_PACKAGES

      - name: Detect and validate changed paths
        id: detect
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          untracked=$(git ls-files --others --exclude-standard)
          if [[ -n $untracked ]]; then
            echo "Updater created unexpected untracked files:" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

          git diff --name-only --output="$RUNNER_TEMP/changed-files" HEAD
          if [[ ! -s $RUNNER_TEMP/changed-files ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r changed_file; do
            if [[ $changed_file != "README.md" && $changed_file != "flake.lock" && ! $changed_file =~ ^pkgs/by-name/[^/]+/[^/]+/hashes\.json$ ]]; then
              echo "Updater changed an unexpected path: $changed_file" >&2
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-files"

          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Summarize version changes
        id: summarize
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          {
            while IFS= read -r changed_file; do
              if [[ $changed_file =~ ^pkgs/by-name/[^/]+/[^/]+/hashes\.json$ ]]; then
                package=$(basename "$(dirname "$changed_file")")
                old_version=$(git show "HEAD:$changed_file" | jq --exit-status --raw-output .version)
                new_version=$(jq --exit-status --raw-output .version "$changed_file")
                echo "- $package: $old_version → $new_version"
              elif [[ $changed_file == "flake.lock" ]]; then
                old_rev=$(git show HEAD:flake.lock | jq --raw-output '.nodes.nixpkgs.locked.rev | .[0:8]')
                new_rev=$(jq --raw-output '.nodes.nixpkgs.locked.rev | .[0:8]' flake.lock)
                echo "- nixpkgs: \`$old_rev\` → \`$new_rev\`"
              fi
            done <"$RUNNER_TEMP/changed-files"
          } >"$RUNNER_TEMP/summary.md"

          if [[ -s "$RUNNER_TEMP/failed-updates" ]]; then
            {
              echo ""
              echo "### Failed updaters (left unchanged)"
              echo ""
              sed 's/^/- /' "$RUNNER_TEMP/failed-updates"
            } >>"$RUNNER_TEMP/summary.md"
          fi

          {
            echo "summary<<UPDATE_SUMMARY_EOF"
            cat "$RUNNER_TEMP/summary.md"
            echo "UPDATE_SUMMARY_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Validate update
        if: steps.detect.outputs.changed == 'true'
        # Full local suite minus the build pass: the updaters already built
        # every changed candidate, and an unrelated package should not be
        # rebuilt from scratch just to publish a version bump.
        run: ./scripts/check.sh --no-build

      - name: Serialize validated patch
        id: serialize
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          git diff --binary --output="$RUNNER_TEMP/source-updates.patch" HEAD
          echo "patch=$(base64 --wrap=0 "$RUNNER_TEMP/source-updates.patch")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish dependency update pull request
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Apply validated update
        env:
          SOURCE_UPDATE_PATCH: ${{ needs.update.outputs.patch }}
        run: printf '%s' "$SOURCE_UPDATE_PATCH" | base64 --decode | git apply

      - name: Create pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          author: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          committer: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          branch: automation/update-sources
          delete-branch: true
          commit-message: |
            build(deps): refresh flake lock and package source pins

            Update the flake lock and package versions and hashes after each candidate builds successfully.
            Regenerate the README package index from the validated metadata.

            Co-authored-by: Aaron <85681241+27Aaron@users.noreply.github.com>
          title: "build(deps): refresh flake lock and package source pins"
          body: |
            ## Summary

            - update the flake lock
            - update package versions and source hashes
            - regenerate the README package index
            - build every changed package candidate before publishing

            ## Version updates

            ${{ needs.update.outputs.summary }}

            ## Automation

            Created by the scheduled dependency updater. Merges automatically
            once every required check passes.
          assignees: 27Aaron
          labels: |
            automation
            documentation
            package
            source-update

  merge:
    name: Auto-merge after checks pass
    needs: [update, publish]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    env:
      UPDATE_PR_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
    steps:
      - name: Require automation token
        shell: bash
        run: |
          if [[ -z $UPDATE_PR_TOKEN ]]; then
            echo "::notice::UPDATE_PR_TOKEN is not configured; the update pull request stays open for manual merge" >&2
            exit 1
          fi

      - name: Wait for checks and merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          readonly pr_branch="automation/update-sources"

          state=$(gh pr view "$pr_branch" --json state --jq .state)
          if [[ $state != "OPEN" ]]; then
            echo "Update pull request is not open (state: $state); nothing to merge"
            exit 0
          fi

          head_sha=$(gh pr view "$pr_branch" --json headRefOid --jq .headRefOid)
          if ! gh pr checks "$pr_branch" --watch --fail-fast --interval 30; then
            echo "::error::Checks on the update pull request failed; leaving it open for inspection" >&2
            exit 1
          fi

          current_sha=$(gh pr view "$pr_branch" --json headRefOid --jq .headRefOid)
          if [[ $current_sha != "$head_sha" ]]; then
            echo "::error::New commits appeared while waiting for checks; this run merges nothing" >&2
            exit 1
          fi

          gh pr merge --squash --delete-branch "$pr_branch"
