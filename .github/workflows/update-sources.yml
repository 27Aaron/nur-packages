name: Update package sources

on:
  workflow_dispatch:
  schedule:
    - cron: "13 20 * * *"

concurrency:
  group: update-sources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      patch: ${{ steps.serialize.outputs.patch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            log-lines = 25

      - name: Update sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run path:.#update-sources

      - name: Detect and validate changed paths
        id: detect
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          untracked=$(git ls-files --others --exclude-standard)
          if [[ -n $untracked ]]; then
            echo "Updater created unexpected untracked files:" >&2
            printf '%s\n' "$untracked" >&2
            exit 1
          fi

          git diff --name-only --output="$RUNNER_TEMP/changed-files" HEAD
          if [[ ! -s $RUNNER_TEMP/changed-files ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r changed_file; do
            if [[ ! $changed_file =~ ^pkgs/by-name/[^/]+/[^/]+/hashes\.json$ ]]; then
              echo "Updater changed an unexpected path: $changed_file" >&2
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-files"

          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Validate update
        if: steps.detect.outputs.changed == 'true'
        run: ./scripts/check.sh

      - name: Serialize validated patch
        id: serialize
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail

          git diff --binary --output="$RUNNER_TEMP/source-updates.patch" HEAD
          echo "patch=$(base64 --wrap=0 "$RUNNER_TEMP/source-updates.patch")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish update pull request
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Apply validated update
        env:
          SOURCE_UPDATE_PATCH: ${{ needs.update.outputs.patch }}
        run: printf '%s' "$SOURCE_UPDATE_PATCH" | base64 --decode | git apply

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN || github.token }}
          branch: automation/update-sources
          delete-branch: true
          commit-message: "build(sources): update package sources"
          title: "build(sources): update package sources"
          body: "Automated package versions and hashes; builds were validated before this pull request was created."
          assignees: 27Aaron
