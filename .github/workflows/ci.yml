name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Evaluate every supported system
        run: nix flake check --no-build --all-systems --no-write-lock-file

      - name: Test expected evaluation failures
        run: checks/check-eval-failures.sh

      - name: Check diffs
        run: |
          git diff --check
          git diff --cached --check
