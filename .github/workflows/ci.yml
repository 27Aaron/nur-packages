name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository with Lix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15
        with:
          github_access_token: ${{ github.token }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Evaluate every supported system
        run: nix flake check --no-build --all-systems --no-write-lock-file

      - name: Test expected evaluation failures
        run: checks/check-eval-failures.sh

      - name: Check diffs
        run: |
          git diff --check
          git diff --cached --check

  build:
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Verify runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"

      - name: Build flake checks
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Evaluate classic NUR selectors
        run: |
          nixpkgs_path=$(nix eval --raw --impure --expr '(builtins.getFlake ("path:" + toString ./.)).inputs.nixpkgs.outPath')
          export NIX_PATH="nixpkgs=$nixpkgs_path"
          nix-instantiate --eval -A buildOutputs ci.nix >/dev/null
          nix-instantiate --eval -A cacheOutputs ci.nix >/dev/null
          nix-instantiate --eval -A cachePaths ci.nix >/dev/null
