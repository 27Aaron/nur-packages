name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ github.token }}

      # The same suite scripts/check.sh runs locally: formatting, evaluation
      # on every supported system, a real build of all checks and packages,
      # the generated README table, updater coverage, shell syntax, the
      # classic NUR selectors, and whitespace checks.
      - name: Validate
        run: ./scripts/check.sh
